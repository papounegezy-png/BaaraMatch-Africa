<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="BaaraMatch Africa - La plateforme de référence pour connecter les talents africains aux meilleures opportunités professionnelles. Candidats, agences et entreprises, trouvez votre match." />
    <meta name="keywords" content="emploi, afrique, recrutement, candidats, agences, entreprises, job, carrière, placement, Sénégal, Côte d'Ivoire, Mali" />
    <meta name="author" content="BaaraMatch Africa" />
    <meta name="theme-color" content="#D97706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <meta property="og:title" content="BaaraMatch Africa - Connectez les talents africains" />
    <meta property="og:description" content="La plateforme de référence pour connecter les talents africains aux meilleures opportunités professionnelles." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    
    <link rel="icon" type="image/png" href="/favi.png" />
    <link rel="apple-touch-icon" href="/favi.png" />
    <title>BaaraMatch Africa - Emploi et Recrutement en Afrique</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Polices des tableaux de bord (Libre Baskerville, JetBrains Mono),
         chargées sans bloquer le premier affichage et en priorité basse :
         les pages publiques ne les utilisent pas. La feuille devient active
         une fois téléchargée. -->
    <link rel="preload" as="style" fetchpriority="low" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>
    <!-- Pages Offres et Employeurs : la recherche part dès le HTML, en
         parallèle du JavaScript (pages/offres.tsx et pages/employeurs.tsx la
         reprennent si l'adresse est la même). -->
    <script>
      (function () {
        function precharger(cle, url) {
          var p = { adresse: location.search };
          p.json = fetch(url, { credentials: "include" })
            .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); });
          p.json.then(function (d) { p.donnees = d; }, function () {});
          window[cle] = p;
        }
        var chemin = location.pathname;
        if (chemin === "/jobs" || chemin === "/candidate/jobs") precharger("__offresPrechargees", "/api/offres" + location.search);
        // 12 premiers employeurs (TAILLE_PAGE de lib/etat-employeurs.ts).
        if (chemin === "/agencies") precharger("__employeursPrecharges", "/api/employeurs" + (location.search ? location.search + "&" : "?") + "taille=12");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
